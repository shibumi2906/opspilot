log_format security_safe "$request_id $request_method $status $request_time";
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
server {
  access_log /var/log/nginx/access.log security_safe;
 listen 8443 ssl;
 server_name app.opspilot.localhost;
 server_tokens off;
 ssl_certificate /tls/app.opspilot.localhost.crt;
 ssl_certificate_key /tls/app.opspilot.localhost.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_tickets off;
 client_max_body_size 64k;
 client_body_timeout 10s;
 client_header_timeout 10s;
 send_timeout 10s;
 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
 add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Cache-Control no-store always;
 proxy_ssl_trusted_certificate /tls/ca.crt;
 proxy_ssl_verify on;
 proxy_ssl_server_name on;
 proxy_ssl_name api;
 proxy_set_header Host api;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_hide_header Content-Security-Policy;
 proxy_hide_header Strict-Transport-Security;
 proxy_hide_header X-Content-Type-Options;
 proxy_hide_header Referrer-Policy;
 proxy_hide_header Permissions-Policy;
 proxy_hide_header Cache-Control;
 location = /auth/login { limit_req zone=auth burst=5 nodelay; limit_req_status 429; proxy_pass https://api:8000; }
 location /auth/ { proxy_pass https://api:8000; }
 location /api/ { proxy_pass https://api:8000; }
 location = /health { proxy_pass https://api:8000; }
 location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
