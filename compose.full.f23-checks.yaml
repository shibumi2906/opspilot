# Combine with the Full test stack through compose.full.f22-checks.yaml.
services:
  postgres:
    image: ${F23_POSTGRES_IMAGE:?Set the local PostgreSQL image ID}
    pull_policy: never
    mem_limit: 768m
    cpus: 1.0
  admin:
    image: ${F23_APP_IMAGE:?Set the local application image ID}
    pull_policy: never
    mem_limit: 512m
    cpus: 1.0
    environment:
      LLM_MODE: scripted
      OPENAI_API_KEY: ''
  mcp:
    image: ${F23_APP_IMAGE:?Set the local application image ID}
    pull_policy: never
    mem_limit: 768m
    cpus: 1.0
  collector:
    image: ${F23_APP_IMAGE:?Set the local application image ID}
    pull_policy: never
    mem_limit: 256m
  telemetry-init:
    image: ${F23_APP_IMAGE:?Set the local application image ID}
    pull_policy: never
  redis:
    image: ${F23_REDIS_IMAGE:?Set the local Redis image ID}
    pull_policy: never
    mem_limit: 256m
  tests:
    image: ${F23_TEST_IMAGE:?Set the local test image ID}
    pull_policy: never
    volumes:
      - ./.tools/f23:/reports
