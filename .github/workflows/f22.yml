name: Full F22 scripted evals
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scripted:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.4'
      - name: Isolated 50 Full plus 12 MVP scripted cases
        run: bash scripts/test-full-f22-ci.sh
      - name: Upload public measured reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f22-scripted
          path: docs/full/evidence/f22/ci/
# No provider credentials, Jira credentials, push, deploy or real eval path.
