# Always combine with compose.full.yaml and the distinct project name opspilot-full-test.
services:
  oidc:
    ports: !reset []
    environment:
      KC_HOSTNAME: http://oidc:8080
      APP_ORIGIN: http://web
  jaeger:
    ports: !reset []
  postgres:
    environment:
      POSTGRES_DB: opspilot_full_test
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ops_migration -d opspilot_full_test]
  api:
    ports: !reset []
    environment:
      APP_ENV: test
      APP_ORIGIN: http://web
      OIDC_ISSUER: http://oidc:8080/realms/opspilot
      ALLOW_DEMO_SELF_APPROVAL: "true"
      LLM_MODE: scripted
      OPENAI_API_KEY: ""
      SCENARIO_ID: greenshop_expired
      IDENTITY_DATABASE_URL: postgresql+psycopg://ops_identity:${IDENTITY_DB_PASSWORD}@postgres/opspilot_full_test
      WORKFLOW_DATABASE_URL: postgresql+psycopg://ops_workflow:${WORKFLOW_DB_PASSWORD}@postgres/opspilot_full_test
      CHECKPOINT_DATABASE_URL: postgresql+psycopg://ops_checkpoint:${CHECKPOINT_DB_PASSWORD}@postgres/opspilot_full_test?options=-csearch_path%3Dcheckpoints
  worker:
    environment:
      APP_ENV: test
      APP_ORIGIN: http://web
      OIDC_ISSUER: http://oidc:8080/realms/opspilot
      ALLOW_DEMO_SELF_APPROVAL: "true"
      LLM_MODE: scripted
      OPENAI_API_KEY: ""
      SCENARIO_ID: greenshop_expired
      WORKFLOW_DATABASE_URL: postgresql+psycopg://ops_workflow:${WORKFLOW_DB_PASSWORD}@postgres/opspilot_full_test
      CHECKPOINT_DATABASE_URL: postgresql+psycopg://ops_checkpoint:${CHECKPOINT_DB_PASSWORD}@postgres/opspilot_full_test?options=-csearch_path%3Dcheckpoints
  mcp:
    environment:
      APP_ENV: test
      APP_ORIGIN: http://web
      OIDC_ISSUER: http://oidc:8080/realms/opspilot
      ALLOW_DEMO_SELF_APPROVAL: "true"
      DOMAIN_DATABASE_URL: postgresql+psycopg://ops_domain:${DOMAIN_DB_PASSWORD}@postgres/opspilot_full_test
  admin:
    environment:
      APP_ENV: test
      APP_ORIGIN: http://web
      OIDC_ISSUER: http://oidc:8080/realms/opspilot
      ALLOW_DEMO_SELF_APPROVAL: "true"
      MIGRATION_DATABASE_URL: postgresql+psycopg://ops_migration:${POSTGRES_PASSWORD}@postgres/opspilot_full_test
  tests:
    volumes:
      - ./.tools/service-keys/private:/run/service-private:ro
      - ./.tools/service-keys/public:/run/service-public:ro
    image: opspilot-full/tests:f01
    build:
      context: .
      target: tests
    init: true
    environment:
      APP_ENV: test
      APP_ORIGIN: http://web
      OIDC_ISSUER: http://oidc:8080/realms/opspilot
      ALLOW_DEMO_SELF_APPROVAL: "true"
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN}
      MCP_URL: http://mcp:8001/mcp
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY}
      IDENTITY_DATABASE_URL: postgresql+psycopg://ops_identity:${IDENTITY_DB_PASSWORD}@postgres/opspilot_full_test
      TEST_API_URL: http://api:8000
      MIGRATION_DATABASE_URL: postgresql+psycopg://ops_migration:${POSTGRES_PASSWORD}@postgres/opspilot_full_test
      WORKFLOW_DATABASE_URL: postgresql+psycopg://ops_workflow:${WORKFLOW_DB_PASSWORD}@postgres/opspilot_full_test
      DOMAIN_DATABASE_URL: postgresql+psycopg://ops_domain:${DOMAIN_DB_PASSWORD}@postgres/opspilot_full_test
      CHECKPOINT_DATABASE_URL: postgresql+psycopg://ops_checkpoint:${CHECKPOINT_DB_PASSWORD}@postgres/opspilot_full_test?options=-csearch_path%3Dcheckpoints
    depends_on:
      api: {condition: service_healthy}
      mcp: {condition: service_started}

  web:
    ports: !reset []
  e2e:
    image: opspilot-full/e2e:f01
    build:
      context: .
      dockerfile: web/Dockerfile
      target: e2e
    init: true
    ipc: host
    environment:
      OIDC_DEMO_PASSWORD: ${OIDC_DEMO_PASSWORD}
      E2E_BASE_URL: http://web
      E2E_DATABASE_URL: postgresql://ops_domain:${DOMAIN_DB_PASSWORD}@postgres/opspilot_full_test
    depends_on:
      web: {condition: service_healthy}

  evals:
    image: opspilot-full/tests:f01
    build:
      context: .
      target: tests
    init: true
    environment:
      APP_ENV: test
      APP_ORIGIN: http://web
      OIDC_ISSUER: http://oidc:8080/realms/opspilot
      ALLOW_DEMO_SELF_APPROVAL: "true"
      LLM_MODE: scripted
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      MIGRATION_DATABASE_URL: postgresql+psycopg://ops_migration:${POSTGRES_PASSWORD}@postgres/opspilot_full_test
      WORKFLOW_DATABASE_URL: postgresql+psycopg://ops_workflow:${WORKFLOW_DB_PASSWORD}@postgres/opspilot_full_test
      DOMAIN_DATABASE_URL: postgresql+psycopg://ops_domain:${DOMAIN_DB_PASSWORD}@postgres/opspilot_full_test
      CHECKPOINT_DATABASE_URL: postgresql+psycopg://ops_checkpoint:${CHECKPOINT_DB_PASSWORD}@postgres/opspilot_full_test?options=-csearch_path%3Dcheckpoints
    volumes:
      - ./.tools/service-keys/private:/run/service-private:ro
      - ./.tools/service-keys/public:/run/service-public:ro
      - ./docs/full/evidence/f05/evals:/reports
    command: [python, -m, opspilot.evals.runner, --commit, unspecified]
